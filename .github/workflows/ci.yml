name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify core package and registry
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run type-aware Oxlint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

      - name: Audit package exports
        run: pnpm publint

      - name: Validate and build registry
        run: pnpm registry:build

      - name: Build and smoke static site
        run: |
          pnpm build:site
          pnpm smoke:site

      - name: Validate Cloudflare deployment bundle
        run: pnpm deploy:site:dry-run

      - name: Smoke registry in Base UI
        run: pnpm smoke:registry:base

      - name: Smoke registry in Radix
        run: pnpm smoke:registry:radix

      - name: Smoke core package tarball
        run: pnpm smoke:package

      - name: Create installable tarball
        run: |
          mkdir -p artifacts
          pnpm --dir packages/calculator-core pack --pack-destination ../../artifacts

      - name: Upload package and registry artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openmirai-calculator-core
          path: |
            artifacts/*.tgz
            registry-dist/*.json
            site-dist
          if-no-files-found: error
