name: Deploy site to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://calculator.openmirai.dev
    env:
      HUSKY: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke static site
        run: |
          pnpm build:site
          pnpm smoke:site

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy

      - name: Write deployment summary
        run: echo "Deployed [calculator.openmirai.dev](https://calculator.openmirai.dev)." >> "$GITHUB_STEP_SUMMARY"
